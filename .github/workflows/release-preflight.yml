name: Release preflight

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version to prepare, for example 0.2.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  signed-bundle-preflight:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE

      - name: Validate release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release version must be a stable numeric version such as 0.2.0" >&2
            exit 1
          fi

      - name: Set release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: >-
          mvn --batch-mode --no-transfer-progress
          versions:set
          "-DnewVersion=$RELEASE_VERSION"
          -DgenerateBackupPoms=false
          -DprocessAllModules=true

      - name: Build and sign bundle without uploading
        run: mvn --batch-mode --no-transfer-progress -Prelease clean deploy -DskipUpload=true
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: Verify bundle contents and signatures
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          import subprocess
          import tempfile
          import zipfile

          bundle = Path("target/central-publishing/central-bundle.zip")
          if not bundle.is_file():
              raise SystemExit(f"Missing Central bundle: {bundle}")

          with zipfile.ZipFile(bundle) as archive:
              names = set(archive.namelist())
              artifacts = {
                  "a2a-spring": "pom",
                  "a2a-spring-core": "jar",
                  "a2a-spring-boot-autoconfigure": "jar",
                  "a2a-spring-boot-starter": "pom",
                  "a2a-spring-boot-starter-web": "jar",
              }
              version = os.environ["RELEASE_VERSION"]
              namespace = "{http://maven.apache.org/POM/4.0.0}"
              for artifact, expected_packaging in artifacts.items():
                  poms = [name for name in names if name.endswith(f"/{artifact}-{version}.pom")]
                  if not poms:
                      raise SystemExit(f"Missing POM for {artifact}")
                  pom = poms[0]
                  base = pom[:-4]
                  required = [pom, base + ".pom.asc"]
                  project = ET.fromstring(archive.read(pom))
                  packaging = project.findtext(f"{namespace}packaging", default="jar")
                  if packaging != expected_packaging:
                      raise SystemExit(
                          f"Unexpected packaging for {artifact}: expected {expected_packaging}, got {packaging}"
                      )
                  if packaging == "jar":
                      required.extend([
                          base + ".jar", base + ".jar.asc",
                          base + "-sources.jar", base + "-sources.jar.asc",
                          base + "-javadoc.jar", base + "-javadoc.jar.asc",
                      ])
                  missing = [name for name in required if name not in names]
                  if missing:
                      raise SystemExit(f"Missing release files for {artifact}: {missing}")
              if any("a2a-spring-sample-hello-world" in name for name in names):
                  raise SystemExit("Runnable sample must not be included in the Central bundle")

              with tempfile.TemporaryDirectory() as temp_dir:
                  archive.extractall(temp_dir)
                  signatures = [name for name in names if name.endswith(".asc")]
                  for signature in signatures:
                      sig_path = Path(temp_dir, signature)
                      artifact_path = Path(str(sig_path)[:-4])
                      subprocess.run(["gpg", "--batch", "--verify", str(sig_path), str(artifact_path)], check=True)

          print(f"Verified {len(signatures)} signatures and expected release artifacts; Central upload was skipped.")
          PY
